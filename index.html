<style>
/* VOICE: a pro trading terminal for a tycoon: calm, dense, exact
   IDEA: an exchange app wallet — balance up top, markets as rows, actions as yellow buttons
   PICTURE: the gold tap coin, the 3D dressing room, live sparklines and the flight map
   COLOUR and TYPE: near-black panels, one yellow accent, green up / red down; IBM Plex Sans with tabular figures
   LAYOUT: one phone column, sticky balance header, underline tabs, bottom tab bar */
:root{color-scheme:dark;
--bg:light-dark(#fafafa,#0b0e11);--card:light-dark(#ffffff,#181a20);--ink:light-dark(#1e2329,#eaecef);
--mute:light-dark(#707a8a,#848e9c);--line:light-dark(#eaecef,#2b3139);--soft:light-dark(#f5f5f5,#1e2329);
--brand:#f0b90b;--brandInk:#181a20;--deep:light-dark(#ffffff,#0b0e11);--gold:#f0b90b;--gold2:#c99400;
--red:#f6465d;--up:#0ecb81;--sea:light-dark(#eef3f8,#12161c);--land:light-dark(#dfe3e8,#2b3139)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
h1,h2,h3{font-family:"IBM Plex Sans",system-ui,sans-serif;margin:0;line-height:1.1}
.app{max-width:620px;margin:0 auto;padding-bottom:96px}
.top{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;padding:12px 16px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;box-shadow:0 6px 20px #0003}
.brand{font:600 13px "IBM Plex Sans",system-ui,sans-serif;opacity:.75;display:flex;gap:6px;align-items:center}
.brand #hdrAv{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#ffffff22;display:grid;place-items:center}.brand #hdrAv svg{width:26px;height:26px}
.map svg{width:100%;height:auto;display:block}.flights{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.flights span{font-size:12.5px;background:var(--soft);padding:5px 9px;border-radius:8px}
.pips{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px}.pips i{width:16px;height:6px;border-radius:3px;background:var(--soft)}.pips i.on{background:var(--gold)}.pips span{white-space:nowrap;font-size:12px;color:var(--mute);margin-left:4px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.av{border-radius:24px;background:radial-gradient(circle at 50% 35%,light-dark(#fff8df,#2a2410),light-dark(#e9efe5,#18231d));overflow:hidden;display:grid;place-items:center}
.inp{width:100%;font:16px "IBM Plex Sans",system-ui,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.inp:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--brand)}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.opt button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:40px;padding:0 12px;font-weight:600;font-size:13px}.opt button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.lab{font-weight:600;font-size:13px;margin-top:4px}
.rl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.rl:first-child{border:0}
.rl .n{font:700 14px "IBM Plex Sans",system-ui,sans-serif;color:var(--mute);text-align:center}.rl b{font-weight:600}.rl small{display:block;color:var(--mute);font-size:12px}.rl.me{background:light-dark(#e2f3ea,#173426);border-radius:12px;padding-inline:8px;margin-inline:-8px;border:0}.rl.me .n{color:var(--brand)}
.item svg{width:100%;height:60px}
.room{position:relative;height:min(64vh,540px);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 30%,light-dark(#ffffff,#2a3a32),light-dark(#dfe8de,#0f1714));display:grid;place-items:center;touch-action:none}
.room canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;cursor:grab}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chipset button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:20px;min-height:40px;padding:0 12px;font-size:13px;font-weight:600}.chipset button.on{border-color:var(--brand);background:light-dark(#e2f3ea,#173426);color:var(--brand)}.chipset i{width:14px;height:14px;border-radius:50%;border:1px solid #0002}
#cash{font:700 clamp(24px,7.4vw,36px)/1.05 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
#rate{font-size:13px;color:#9fe3bf;font-variant-numeric:tabular-nums}
.pay{grid-row:1/5;grid-column:2;display:grid;place-items:center;position:relative;width:58px;height:58px}
.pay svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pay b{font:600 12px "IBM Plex Sans",system-ui,sans-serif;text-align:center;line-height:1.1}.pay b small{display:block;font:500 9px "IBM Plex Sans",system-ui,sans-serif;opacity:.7}
.top.flash #cash{animation:fl .5s}@keyframes fl{40%{color:var(--gold)}}
main{padding:14px 14px 0;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:18px;margin-bottom:4px}.sub{color:var(--mute);font-size:13px;margin:0}
.row{display:flex;align-items:center;gap:12px}.row>.grow{flex:1}
.btn{border:0;border-radius:11px;min-height:44px;padding:0 14px;background:var(--brand);color:#fff;font-weight:600;white-space:nowrap}
.btn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.btn.holding{box-shadow:0 0 0 3px var(--gold)}
.btn:disabled{background:var(--soft);color:var(--mute);cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.sell{background:light-dark(#fbe5df,#3a1d16);color:var(--red)}.btn.sell:disabled{background:var(--soft);color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin:0 0 4px}.pack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.pk{background:var(--soft);border-radius:14px;padding:14px;display:grid;gap:6px;text-align:center}.pk b{font:700 20px "IBM Plex Sans",system-ui,sans-serif}
.cr .tk{background:light-dark(#ede7fb,#251d3a);color:light-dark(#4b2fa3,#b9a6ff)}.btn.warn{background:var(--red)}
.btn:focus-visible,.seg button:focus-visible,.nav button:focus-visible,.coin:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.tapzone{position:relative;display:grid;place-items:center;padding:26px 0 10px;overflow:hidden;border-radius:20px;background:radial-gradient(circle at 50% 45%,light-dark(#fff8df,#2a2410),transparent 65%)}
.coin{width:min(56vw,210px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 34% 28%,#fff3b8,var(--gold) 45%,var(--gold2) 100%);box-shadow:inset 0 -8px 0 #0002,inset 0 0 0 10px #fff3,0 14px 30px #c8921a55;display:grid;place-items:center;transition:transform .08s}
.coin span{font:700 clamp(64px,20vw,92px) "IBM Plex Sans",system-ui,sans-serif;color:#8a5d06;text-shadow:0 2px 0 #fff6}
.coin:active{transform:scale(.94)}
.float{position:absolute;font:700 20px "IBM Plex Sans",system-ui,sans-serif;color:var(--brand);pointer-events:none;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.tapv{margin:12px 0 0;color:var(--mute)}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .4s}
.bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--soft);border-radius:12px;padding:10px}.stat small{display:block;color:var(--mute);font-size:12px}.stat b{font:600 17px "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:44px;font-weight:600;font-size:14px}
.seg button.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;font-size:14px;white-space:nowrap}.tabs button small{font-weight:500;color:var(--mute);font-size:11px}.tabs .on{background:var(--brand);color:#fff;border-color:var(--brand)}.tabs .on small{color:#fffb}
.lock{text-align:center;padding:28px 18px}.lock svg{width:120px;height:auto;margin-bottom:10px}.lock p{max-width:40ch;margin:6px auto 16px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:grid;gap:4px}
.slot svg{width:100%;height:56px}.slot.empty{border-style:dashed}
.slot b{font:600 15px "IBM Plex Sans",system-ui,sans-serif}.slot small{color:var(--mute);font-size:12px}
.slot .cta{margin-top:6px;font-size:13px;font-weight:600;color:var(--brand)}
.list{display:grid}.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .grow{flex:1}.li b{font-weight:600}.li small{display:block;color:var(--mute);font-size:12.5px}
.mono{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font:700 14px "IBM Plex Sans",system-ui,sans-serif;color:#fff}
.rt{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;font:700 16px "IBM Plex Sans",system-ui,sans-serif}
.r1{background:var(--soft);color:var(--mute)}.r2{background:#e8c9a6;color:#6b3f12}.r3{background:#cfdcea;color:#244766}.r4{background:var(--gold);color:#5a3b00}
.mini{height:5px;margin-top:6px}
.tag{font-size:12px;font-weight:600;color:var(--brand);background:light-dark(#e2f3ea,#173426);padding:5px 10px;border-radius:20px;white-space:nowrap}
.big{font:700 44px/1 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.res{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.res span{font:600 12px "IBM Plex Sans",system-ui,sans-serif;padding:4px 8px;border-radius:8px}
.w{background:light-dark(#dff3e8,#173426);color:var(--up)}.l{background:light-dark(#fbe5df,#3a1d16);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}td,th{padding:7px 4px;text-align:left;border-top:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:12px;border:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me td{font-weight:700;color:var(--brand)}
.stk{border-top:1px solid var(--line)}.stk:first-child{border:0}
.stk-row{width:100%;border:0;background:none;display:grid;grid-template-columns:54px minmax(0,1fr) 64px 84px;gap:10px;align-items:center;padding:11px 0;text-align:left}
.tk{font:700 13px "IBM Plex Sans",system-ui,sans-serif;background:var(--soft);border-radius:8px;padding:6px 0;text-align:center}
.nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.px{text-align:right;font:600 14px "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}.px small{display:block;font-size:12px}
.upc{color:var(--up)}.dnc{color:var(--red)}
.panel{background:var(--soft);border-radius:14px;padding:12px;margin-bottom:12px}
.panel .stats{margin:0 0 10px}.panel .stat{background:var(--card)}
.trade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}.trade .btn{padding:0 4px;font-size:13px}
.chips{display:flex;gap:6px;margin-bottom:6px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:0 14px;min-height:36px;font-size:13px;font-weight:600}.chips .on{background:var(--ink);color:var(--bg)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px max(8px,calc(50vw - 310px)) calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);min-height:52px;border-radius:12px}
.nav svg{width:24px;height:24px}.nav .on{color:var(--brand)}
.sheet{position:fixed;inset:0;z-index:10;display:grid;align-items:end}.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:#0007}
.sheet-card{position:relative;background:var(--card);border-radius:22px 22px 0 0;max-height:85vh;overflow:auto;padding:18px 16px 28px;width:100%;max-width:620px;margin:0 auto;animation:sl .22s}
@keyframes sl{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;z-index:20;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.foot{text-align:center;padding:6px 0 10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){.stk-row{grid-template-columns:48px minmax(0,1fr) 76px}.stk-row svg{display:none}}

/* ---- exchange-style theme overrides ---- */
body{letter-spacing:.005em}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
.top{background:var(--deep);color:var(--ink);box-shadow:none;border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 14px}

.brand #hdrAv{background:var(--soft)}
.bal{font-size:12px;color:var(--mute);margin-top:6px;display:flex;gap:6px;align-items:center}.bal span{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
#cash{font:600 clamp(26px,7.6vw,34px)/1.1 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:-.02em}

.top.flash #cash{animation:none}

.card{border:0;border-radius:12px;padding:16px;background:var(--card)}

.tabs .on small{color:var(--mute)}
.chips button{border-radius:6px;border:0;background:var(--soft);color:var(--mute)}.chips .on{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand)}

.stat{background:var(--soft);border-radius:8px}.stat small{font-size:11.5px}.stat b{font:600 16px "IBM Plex Sans",system-ui,sans-serif}
.panel{background:var(--soft);border-radius:8px}.panel .stat{background:var(--card)}
.tk{background:var(--soft);border-radius:6px;font-weight:600;font-size:12px}

.px small.upc{background:var(--up);color:#fff}.px small.dnc{background:var(--red);color:#fff}
.upc{color:var(--up)}.dnc{color:var(--red)}
.stk{border-color:var(--line)}
.li{border-color:var(--line)}
.mono{border-radius:8px}.rt{border-radius:8px}
.r4{background:var(--brand);color:var(--brandInk)}.r3{background:light-dark(#e6edf7,#22314a);color:light-dark(#2b4f7f,#8fb4ec)}.r2{background:light-dark(#f6ece0,#3a2c1c);color:light-dark(#7a4a12,#e0b17a)}
.bar{background:var(--soft);height:6px}.bar i{background:var(--brand)}
.big{font:600 40px/1 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:-.02em}
.tapzone{background:radial-gradient(circle at 50% 45%,light-dark(#fff6d6,#2a240c),transparent 62%);border-radius:12px}

.av{border-radius:12px;background:radial-gradient(circle at 50% 35%,light-dark(#fff6d6,#2b2a1f),light-dark(#eef0f2,#1e2329))}
.room{border-radius:10px;background:radial-gradient(circle at 50% 30%,light-dark(#ffffff,#4a525e),light-dark(#e3e7ec,#1e2329) 75%)}
.inp{background:var(--soft);border:1px solid transparent;border-radius:8px}.inp:focus-visible{outline:none;border-color:var(--brand)}

tr.me td{color:var(--brand)}
#toast{background:light-dark(#1e2329,#2b3139);color:#eaecef;border-radius:8px}
.sheet-card{background:var(--card);border-radius:16px 16px 0 0}
.pk{background:var(--soft);border-radius:10px}
.pips i.on{background:var(--brand)}
.li small.nx{color:var(--up);font-weight:500}
.btn2{display:grid;justify-items:center;line-height:1.15;min-width:86px;padding:6px 12px}.btn2 span{font-size:11px;font-weight:500;opacity:.75}
.flights span{background:var(--soft);border-radius:6px}
.coin:focus-visible,.btn:focus-visible,.seg button:focus-visible,.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

<body>
<div class="app">
  <header class="top" id="top">
    <div class="brand"><span id="hdrAv"></span>Businessman Tycoon</div>

/* ---------- tournament ---------- */
function startTour(){
  if(S.team.tour)return;if(S.team.roster.length<11)return toast('You need 11 players to enter');
  const opps=shuffle(AI).slice(0,9),tb={},seed={};
  [ME,...opps].forEach(n=>{tb[n]=[0,0];seed[n]=Math.random()});
  S.team.tour={start:Date.now(),opps,tb,seed,res:[],round:0};toast('Tournament started — 9 matches over 10 minutes');
}
function playRound(t){
  const opp=t.opps[t.round],win=Math.random()<winChance();
  t.res.push({o:opp,w:win});t.tb[ME][win?0:1]++;t.tb[opp][win?1:0]++;
  const rest=shuffle(t.opps.filter(o=>o!==opp));
  for(let j=0;j<rest.length;j+=2){const[a,b]=Math.random()<.5?[rest[j],rest[j+1]]:[rest[j+1],rest[j]];t.tb[a][0]++;t.tb[b][1]++}
  t.round++;
}
const standings=t=>Object.entries(t.tb).map(([n,[w,l]])=>({n,w,l})).sort((a,b)=>b.w-a.w||t.seed[b.n]-t.seed[a.n]);
function processTour(now){
  const t=S.team.tour;if(!t)return false;let ch=false;
  while(t.round<ROUNDS&&now>=t.start+(t.round+1)*TOUR_MS/ROUNDS){playRound(t);ch=true}
  if(t.round>=ROUNDS){
    const st=standings(t),place=st.findIndex(x=>x.n===ME)+1,me=t.tb[ME];
    const prize=me[0]*60000+([3000000,1200000,500000][place-1]||0);
    earn(prize);S.team.last={place,w:me[0],l:me[1],prize};S.team.played++;if(place===1)S.team.titles++;
    S.team.tour=null;toast(place===1?'Champions! You won '+fmt(prize):'Finished #'+place+' — prize '+fmt(prize));ch=true;
  }
  return ch;
}

/* ---------- stocks ---------- */
function tickStocks(){
  S.st.p=S.st.p.map((p,i)=>{const b=STOCKS[i].base;let n=p*(1+(Math.random()-.5)*.1+.04*Math.log(b/p));return Math.max(b*.2,Math.min(b*5,n))});
  S.st.h.forEach((h,i)=>{h.push(S.st.p[i]);if(h.length>40)h.shift()});
  const o=S.oil;o.p=Math.max(30,Math.min(200,o.p*(1+(Math.random()-.5)*.08+.05*Math.log(80/o.p))));o.h.push(o.p);if(o.h.length>40)o.h.shift();
}
function tickCrypto(){
  S.cr.p=S.cr.p.map((p,i)=>{const c=COINS[i];let n=p*(1+(Math.random()-.5)*2*c.vol+.03*Math.log(c.base/p));
    if(Math.random()<.04)n*=Math.random()<.5?1.4+Math.random()*.8:.35+Math.random()*.35;
    return Math.max(c.base*.01,Math.min(c.base*100,n))});
  S.cr.h.forEach((h,i)=>{h.push(S.cr.p[i]);if(h.length>40)h.shift()});
}

function spark(h){
  const W=64,H=26,mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
  const pts=h.map((v,i)=>(i/(Math.max(h.length-1,1))*W).toFixed(1)+','+(H-2-(v-mn)/r*(H-4)).toFixed(1)).join(' ');
  const c=h[h.length-1]>=h[0]?'var(--up)':'var(--red)';
  return `<svg viewBox="0 0 ${W} ${H}" width="64" height="26" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
function render(){
  const tb=$('.tabs');if(tb)ui.tx[ui.view]=tb.scrollLeft;
  $('#main').innerHTML=({home:vHome,biz:vBiz,prop:vProp,markets:vMarkets,shop:vShop,you:vYou})[ui.view]();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.view));
  const nt=$('.tabs');if(nt)nt.scrollLeft=ui.tx[ui.view]||0;
  $('#hdrAv').innerHTML=avatarSvg(26,1);
  mountRoom();
  renderSheet();header(Date.now());live(Date.now());
}
function renderSheet(){
  const el=$('#sheet');if(!ui.sheet){el.hidden=true;return}
  el.hidden=false;
  if(ui.sheet.t==='ad'){const a=ui.sheet,b=a.biz;$('#sheetBody').innerHTML=`<div style="text-align:center"><p class="sub">Advertisement</p><div style="background:var(--soft);border-radius:18px;padding:22px 12px;margin:10px 0">${ART[b]}<h3 style="font-size:26px;margin-top:8px">${BIZNAME[b]}</h3><p class="sub">${AD_LINES[b]}</p></div>
    ${a.done?`<button class="btn" style="width:100%" data-act="claimAd">Claim +${BOOST_TPS} taps/sec for 1 minute</button>`:`<div class="bar"><i id="adBar" style="width:0;transition:none"></i></div><p class="sub" style="margin-top:8px">Reward in <b id="adCd">15</b>s</p><button class="btn ghost" style="width:100%;margin-top:6px" data-act="close">Close and skip reward</button>`}</div>`;return}
  $('#sheetBody').innerHTML=ui.sheet.t==='slot'?sheetSlot(ui.sheet.b||'taxi',ui.sheet.i)+'<button class="btn ghost" style="width:100%;margin-top:12px" data-act="close">Close</button>':
    `<h3>Reset your empire?</h3><p class="sub" style="margin:8px 0 16px">This wipes all cash, businesses, property and shares. It can't be undone.</p><div class="row"><button class="btn ghost grow" data-act="close">Cancel</button><button class="btn warn grow" data-act="reset">Reset game</button></div>`;
}
let lastTouch=0,pending=false;document.addEventListener('pointerdown',()=>lastTouch=Date.now(),true);document.addEventListener('scroll',e=>{lastTouch=Date.now();if(e.target.classList&&e.target.classList.contains('tabs'))ui.tx[ui.view]=e.target.scrollLeft},{passive:true,capture:true});
function refresh(){
  if(ui.view==='you'&&ui.you==='room')return;
  if(ui.view!=='home'&&(Date.now()-lastTouch<900||document.activeElement?.id==='meName')){pending=true;return}pending=false;
  if(ui.view==='home'){const h=$('#homeStats');if(h)h.innerHTML=vHomeStats();const u=$('#upTap button');if(u)u.disabled=S.cash<TAPC[S.tapLvl]}
  else render();
  if(ui.sheet&&ui.view!=='home')return;renderSheet();
}
const cashText=()=>S.cash<1e12?'$'+Math.floor(S.cash).toLocaleString('en-AU'):fmt(S.cash);
function header(now){
  $('#cash').textContent=cashText();$('#rate').textContent='+'+pm(income()+autoRate());
  const left=Math.max(0,S.nextPay-now);
  $('#ring').setAttribute('stroke-dashoffset',(157.1*(left/1000)).toFixed(1));
  $('#payIn').innerHTML='+'+fmt(income()/60).replace('$','$')+'<small>per sec</small>';
}
const AD_LINES={taxi:'Get there faster. Book a ride today.',tob:'Your local corner store, now in 25 suburbs.',market:'Fresh every morning. Prices you’ll love.',team:'Season tickets on sale now.',oil:'Powering the nation, one barrel at a time.',def:'Protecting what matters.',air:'Fly Sydney to the world in style.'};
function live(now){
  document.querySelectorAll('#boostTxt').forEach(e=>e.textContent=boostText());
  const a=ui.sheet;if(a&&a.t==='ad'&&!a.done){const left=a.end-now;if(left<=0){a.done=true;renderSheet()}else{const c=$('#adCd');if(c)c.textContent=Math.ceil(left/1000);const bb=$('#adBar');if(bb)bb.style.width=(100-left/AD_MS*100)+'%'}}
  const t=S.team.tour,cd=$('#tourCd');
  if(t&&cd){const nxt=t.start+(t.round+1)*TOUR_MS/ROUNDS,s=Math.max(0,Math.ceil((nxt-now)/1000));cd.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('#tourBar').style.width=Math.min(100,(now-t.start)/TOUR_MS*100)+'%'}
  const cc=$('#crCd');if(cc)cc.textContent=Math.max(0,Math.ceil((S.nextCrypto-now)/1000))+'s';
  const sc=$('#stkCd');if(sc)sc.textContent=Math.max(0,Math.ceil((S.nextStock-now)/1000))+'s';
}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- actions ---------- */
const A={
  nav:d=>{ui.view=d.v;ui.sheet=null;render();scrollTo(0,0)},
  biz:d=>{ui.biz=d.v;render()},
  tap:(d,e)=>{const v=TAPV[S.tapLvl];earn(v);S.taps++;header(Date.now());
    const z=$('#tapzone'),r=z.getBoundingClientRect(),f=document.createElement('span');f.className='float';f.textContent='+'+fmt(v);
    f.style.left=((e.clientX||r.left+r.width/2)-r.left-14+(Math.random()*30-15))+'px';f.style.top=((e.clientY||r.top+r.height/2)-r.top-20)+'px';
    z.appendChild(f);setTimeout(()=>f.remove(),800);const u=$('#upTap button');if(u)u.disabled=S.cash<TAPC[S.tapLvl];return 'nosave'},
  upTap:()=>{if(spend(TAPC[S.tapLvl])){S.tapLvl++;render()}},
  buyBiz:d=>{const b=d.b;if(S[b].own)return;if(spend(BIZ[b])){S[b].own=true;toast(BIZNAME[b]+' is yours');render()}},
  slot:d=>{ui.sheet={t:'slot',b:d.b,i:+d.i};renderSheet()},
  buyCar:d=>{const b=d.b,F=FLEET[b],i=+d.i,k=+d.k,cur=S[b].cars[i],cost=F.types[k][1]-(cur>=0?F.types[cur][1]/2:0);if(spend(cost)){S[b].cars[i]=k;ui.sheet=null;toast(F.types[k][0]+' '+F.verb);render()}},
  buySlot:d=>{const b=d.b,F=FLEET[b],e=S[b].cars.length-F.base;if(e<F.extra.length&&spend(F.extra[e])){S[b].cars.push(-1);render()}},
  line:d=>{const b=d.b,i=+d.i,l=S[b].lv[i];if(l<AMAX&&spend(aCost(b,i,l))){S[b].lv[i]++;render()}},
  tp:d=>{const k=+d.i;if(!S.tob.p[k]&&spend(TOBP[k].cost)){S.tob.p[k]=true;const all=S.tob.p.every(Boolean);toast(all?'Full range stocked — tobacco income ×3!':TOBP[k].b+' stocked: +5% across all stores');render()}},
  pup:d=>{const i=+d.i,u=S.pu[i];if(S.props[i]&&u<4&&spend(puCost(i,u))){S.pu[i]++;render()}},
  you:d=>{ui.you=d.v;render()},
  wear3:d=>{const it=ITEMS[d.id];if(!it||!S.own[it.id])return;S.me[it.slot]=it.id;render()},
  unwear:d=>{S.me[d.v]='';render()},
  cam:d=>{R3.preset=d.v;R3.idle=Date.now()},
  me:d=>{const k=d.k;S.me[k]=k==='beard'?d.v==='1':+d.v;render()},
  buyItem:d=>{const it=ITEMS[d.id];if(!it||S.own[it.id])return;if(spend(it.price)){S.own[it.id]=true;if(it.slot)S.me[it.slot]=it.id;toast((it.slot?'Bought and wearing ':'You bought a ')+it.name);render()}},
  wear:d=>{const it=ITEMS[d.id];if(!it||!S.own[it.id])return;S.me[it.slot]=S.me[it.slot]===it.id&&it.slot!=='outfit'?'':it.id;render()},
  tob:()=>{const n=S.tob.n;if(n<TOBMAX&&spend(tobCost(n))){S.tob.n++;render()}},
  release:d=>{const T=S.team,p=T.roster.find(x=>x.id===d.id);if(!p)return;earn(p.cost/2);T.roster=T.roster.filter(x=>x.id!==d.id);toast(p.cost?'Sold '+p.name+' for '+fmt(p.cost/2):p.name+' released');render()},
  sign:d=>{const T=S.team,p=PLAYERS.find(x=>x.id===d.id);if(T.roster.length>=11)return toast('Roster full — release someone first');if(spend(p.cost)){T.roster.push({...p});toast('Signed '+p.name+' ('+p.r+')');render()}},
  startTour:()=>{startTour();render()},
  buyProp:d=>{const i=+d.i;if(!S.props[i]&&spend(PROPS[i].price)){S.props[i]=true;toast('Bought '+PROPS[i].name+', '+PROPS[i].sub);render()}},
  filter:d=>{ui.filter=d.v;render()},
  stk:d=>{ui.open=ui.open===+d.i?-1:+d.i;render()},
  trade:d=>{const i=+d.i,q=+d.q,p=S.st.p[i],o=S.st.own[i];
    if(q>0){const n=Math.min(q,SHARES-o,Math.floor(S.cash/p));if(n<1)return toast('Not enough cash');S.cash-=n*p;S.st.own[i]+=n;S.st.cost[i]+=n*p;if(S.st.own[i]===SHARES)toast('You now own 100% of '+STOCKS[i].n)}
    else{const n=Math.min(-q,o);if(n<1)return;S.st.cost[i]-=S.st.cost[i]*(n/o);S.st.own[i]-=n;if(!S.st.own[i])S.st.cost[i]=0;S.cash+=n*p;toast('Sold '+n+' shares for '+fmt(n*p))}render()},
  mk:d=>{ui.mk=d.v;render()},
  cstk:d=>{ui.copen=ui.copen===+d.i?-1:+d.i;render()},
  ctrade:d=>{const i=+d.i,f=+d.f,C=S.cr,p=C.p[i];
    if(f>0){const amt=S.cash*f;if(amt<0.01)return toast('Not enough cash');S.cash-=amt;C.own[i]+=amt/p;C.cost[i]+=amt;toast('Bought '+fmtU(amt/p)+' '+COINS[i].t)}
    else{const k=-f,u=f===-1?C.own[i]:C.own[i]*k,v=u*p;C.own[i]-=u;C.cost[i]-=C.cost[i]*(f===-1?1:k);if(f===-1){C.own[i]=0;C.cost[i]=0}S.cash+=v;toast('Sold for '+fmt(v))}render()},
  buyAuto:()=>{const a=S.auto;if(a<AUTO.length&&spend(AUTO[a][2])){S.auto++;toast(AUTO[a][0]+' hired');render()}},
  pack:d=>{const[n,v]=PACKS[+d.i];S.cash+=v;toast(n+': +'+fmt(v));render()},
  askReset:()=>{ui.sheet={t:'reset'};renderSheet()},
  reset:()=>{S=fresh();ui.sheet=null;ui.view='home';ui.open=-1;ui.copen=-1;save();render();toast('Fresh start')},
  watchAd:()=>{S.boostUntil=Math.max(Date.now(),S.boostUntil||0)+BOOST_MS;toast('Boost on: +'+BOOST_TPS+' taps/sec for 1 minute');live(Date.now())},
  /* testing: ads skipped for now — rename playAd back to watchAd to restore the 15-second ad */
  playAd:()=>{const ks=Object.keys(BIZNAME);ui.sheet={t:'ad',end:Date.now()+AD_MS,done:false,biz:ks[Math.floor(Math.random()*ks.length)]};renderSheet()},
  claimAd:()=>{if(!ui.sheet||!ui.sheet.done)return;S.boostUntil=Math.max(Date.now(),S.boostUntil||0)+BOOST_MS;ui.sheet=null;renderSheet();toast('Boost on: +'+BOOST_TPS+' taps/sec for 1 minute');live(Date.now())},
  close:()=>{ui.sheet=null;renderSheet()}
};
document.addEventListener('input',e=>{if(e.target.id==='meName'){S.me.name=e.target.value.slice(0,18);save()}});
document.addEventListener('change',e=>{if(e.target.id==='meName')render()});
/* hold-to-repeat on upgrade and trade buttons */
const HOLD=new Set(['upTap','line','tob','pup','buySlot','buyAuto','trade','ctrade','buyProp']);
let hold=null,eatClick=false;
const holdSel=d=>'[data-act="'+d.act+'"]'+['b','i','q','f'].filter(k=>d[k]!=null).map(k=>'[data-'+k+'="'+d[k]+'"]').join('');
function stopHold(){if(!hold)return;clearTimeout(hold.t);if(hold.fired){eatClick=true;setTimeout(()=>eatClick=false,350)}const b=document.querySelector(holdSel(hold.d));if(b)b.classList.remove('holding');hold=null;save()}
function holdStep(){
  if(!hold)return;const b=document.querySelector(holdSel(hold.d));
  if(!b||b.disabled)return stopHold();
  hold.fired=true;A[hold.d.act]({...hold.d});const nb=document.querySelector(holdSel(hold.d));if(nb)nb.classList.add('holding');
  hold.gap=Math.max(45,hold.gap*.85);hold.t=setTimeout(holdStep,hold.gap);
}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled||!HOLD.has(b.dataset.act))return;
  stopHold();hold={d:{...b.dataset},x:e.clientX,y:e.clientY,gap:170,fired:false};hold.t=setTimeout(holdStep,420)});
document.addEventListener('pointermove',e=>{if(hold&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>12)stopHold()});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,stopHold));
window.addEventListener('blur',stopHold);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.btn'))e.preventDefault()});
document.addEventListener('click',e=>{if(eatClick){eatClick=false;return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const r=A[b.dataset.act]?.(b.dataset,e);if(r!=='nosave')save()});

/* ---------- loop ---------- */
{const now=Date.now();
 if(S.nextPay<now){const n=Math.min(Math.floor((now-S.nextPay)/1000)+1,43200),g=income()/60*n;earn(g);S.nextPay=now+1000;if(g>0&&n>2)setTimeout(()=>toast('While you were away you earned '+fmt(g)),400)}
 if(S.nextStock<now)S.nextStock=now+10000;if(S.nextCrypto<now)S.nextCrypto=now+5000;
 if(S.nextAuto<now){const s=Math.min(Math.floor((now-S.nextAuto)/1000),43200),bs=Math.max(0,Math.min(s,((S.boostUntil||0)-S.nextAuto)/1000)),g=((S.auto?AUTO[S.auto-1][1]:0)*s+BOOST_TPS*bs)*TAPV[S.tapLvl];earn(g);S.nextAuto=now+1000}
 processTour(now);}
render();
/* earnings accrue continuously: every 5 ms of game time pays income/12000, drawn every screen frame */
let lastAcc=Date.now();
function accrue(){const now=Date.now(),dt=Math.min(now-lastAcc,5000);if(dt>=5){const steps=Math.floor(dt/5);earn(income()/12000*steps);lastAcc+=steps*5;$('#cash').textContent=cashText()}mapTick(now);requestAnimationFrame(accrue)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const now=Date.now(),gap=now-lastAcc;if(gap>5000){earn(income()/60000*Math.min(gap,43200000));}lastAcc=now}});
requestAnimationFrame(accrue);
let tapSaves=0;
const loop=setInterval(()=>{
  const now=Date.now();let ch=false;
  if(now>=S.nextPay){S.nextPay+=1000;if(S.nextPay<now)S.nextPay=now+1000;ch=true}
  let st=false;if(now>=S.nextStock){tickStocks();S.nextStock=now+10000;st=true}
  if(now>=S.nextCrypto){tickCrypto();S.nextCrypto=now+5000;st=true}
  if(now>=S.nextAuto){S.nextAuto=now+1000;const t=autoTps();if(t){const v=t*TAPV[S.tapLvl];earn(v);const z=$('#tapzone');if(z){const f=document.createElement('span');f.className='float';f.textContent='+'+fmt(v);f.style.left=(z.clientWidth/2+(Math.random()*120-60))+'px';f.style.top=(z.clientHeight/2-40)+'px';z.appendChild(f);setTimeout(()=>f.remove(),800);const u=$('#upTap button');if(u)u.disabled=S.cash<TAPC[S.tapLvl]}}}
  if(processTour(now))ch=true;
  if(ch||(st&&(ui.view==='markets'||(ui.view==='biz'&&ui.biz==='oil')))){refresh();save()}else if(pending)refresh();
  header(now);live(now);
  if(++tapSaves%10===0)save();
},250);
}
